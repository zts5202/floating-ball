name: Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 always installed the removed "tools" package and fails on current
      # cmdline-tools ("Failed to find package 'tools'"). v4 does not, and an
      # empty packages list skips the default platform-tools install so the
      # next step can request the exact SDK packages this project needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build arm64 debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Collect APK and checksum
        run: |
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$SRC" floating-ball-0.1.0-debug-arm64.apk
          sha256sum floating-ball-0.1.0-debug-arm64.apk | tee apk-sha256.txt
          SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > release-notes.md <<EOF
          悬浮球 debug APK，仅包含 arm64-v8a 原生库（应用本身为 Kotlin，无自有 so）。

          - versionName: 0.1.0
          - versionCode: 1
          - ABI: arm64-v8a
          - SHA-256: ${SHA}

          安装后打开应用，允许「显示在其他应用上层」，再打开「启用悬浮球」。
          EOF

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: floating-ball-debug-arm64
          path: |
            floating-ball-0.1.0-debug-arm64.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-debug >/dev/null 2>&1; then
            gh release edit v0.1.0-debug --prerelease --title "悬浮球 0.1.0 debug arm64" --notes-file release-notes.md
          else
            gh release create v0.1.0-debug --prerelease --title "悬浮球 0.1.0 debug arm64" --notes-file release-notes.md
          fi
          gh release upload v0.1.0-debug floating-ball-0.1.0-debug-arm64.apk --clobber
